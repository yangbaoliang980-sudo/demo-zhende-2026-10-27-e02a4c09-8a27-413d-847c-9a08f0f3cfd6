<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" version="1.1"><title>P25 CONSTRUCTION_GUIDE_NOT_CHARACTER_ART</title><metadata>{"kind": "CONSTRUCTION_GUIDE_NOT_CHARACTER_ART", "production_allowed": false, "style_version": "P25-ART-BIBLE/0.1.0"}</metadata><rect x="0" y="0" width="1600" height="1240" rx="0" fill="#121520" stroke="none" stroke-width="1" /><text x="44" y="40" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="17" fill="#E6BF7D" text-anchor="start" id="p25_text_0000">KOTODAMA BRIGADE / P25</text><text x="1556" y="40" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="17" fill="#C0C9DA" text-anchor="end" id="p25_text_0001">P25-ART-BIBLE / 0.1.0</text><text x="44" y="94" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="36" fill="#F5F1E9" text-anchor="start" id="p25_text_0002">比例与裁切 · 用量尺沟通，用样本定稿</text><text x="44" y="132" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#C0C9DA" text-anchor="start" id="p25_text_0003">下图只有几何构成线；没有绘制角色，不计入正式样本数量</text><rect x="44" y="1178" width="1512" height="1" rx="0" fill="#8D9AB5" stroke="none" stroke-width="1" /><text x="44" y="1214" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="17" fill="#E6BF7D" text-anchor="start" id="p25_text_0004">规范图 · 不是人物/敌人成稿</text><rect x="44" y="174" width="458" height="944" rx="14" fill="#202535" stroke="none" stroke-width="1" /><text x="70" y="216" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="23" fill="#F5F1E9" text-anchor="start" id="p25_text_0005">正面中立姿势 · 6.25 头高</text><line x1="78" y1="270" x2="462" y2="270" stroke="#8D9AB5" stroke-width="1" stroke-dasharray="6 6" /><text x="84" y="261" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="16" fill="#C0C9DA" text-anchor="start" id="p25_text_0006">0 H</text><line x1="78" y1="388" x2="462" y2="388" stroke="#8D9AB5" stroke-width="1" stroke-dasharray="6 6" /><text x="84" y="379" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="16" fill="#C0C9DA" text-anchor="start" id="p25_text_0007">1 H</text><line x1="78" y1="506" x2="462" y2="506" stroke="#8D9AB5" stroke-width="1" stroke-dasharray="6 6" /><text x="84" y="497" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="16" fill="#C0C9DA" text-anchor="start" id="p25_text_0008">2 H</text><line x1="78" y1="624" x2="462" y2="624" stroke="#8D9AB5" stroke-width="1" stroke-dasharray="6 6" /><text x="84" y="615" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="16" fill="#C0C9DA" text-anchor="start" id="p25_text_0009">3 H</text><line x1="78" y1="742" x2="462" y2="742" stroke="#8D9AB5" stroke-width="1" stroke-dasharray="6 6" /><text x="84" y="733" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="16" fill="#C0C9DA" text-anchor="start" id="p25_text_0010">4 H</text><line x1="78" y1="860" x2="462" y2="860" stroke="#8D9AB5" stroke-width="1" stroke-dasharray="6 6" /><text x="84" y="851" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="16" fill="#C0C9DA" text-anchor="start" id="p25_text_0011">5 H</text><line x1="78" y1="978" x2="462" y2="978" stroke="#8D9AB5" stroke-width="1" stroke-dasharray="6 6" /><text x="84" y="969" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="16" fill="#C0C9DA" text-anchor="start" id="p25_text_0012">6 H</text><ellipse cx="251" cy="329.0" rx="53" ry="59.0" fill="none" stroke="#97E2F6" stroke-width="3" /><path d="M 221 388 L 221 421.03999999999996 M 281 388 L 281 421.03999999999996" stroke="#97E2F6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 172 425.76 L 330 425.76 L 310 647.6 L 192 647.6 Z" stroke="#97E2F6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 172 425.76 L 140 539.04 L 159 653.5 M 330 425.76 L 362 539.04 L 343 653.5" stroke="#97E2F6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 207 647.6 L 202 830.5 L 191 989.8 L 169 1007.5 L 216 1007.5 M 295 647.6 L 300 830.5 L 311 989.8 L 333 1007.5 L 286 1007.5" stroke="#97E2F6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="251" y1="258" x2="251" y2="1034" stroke="#E6BF7D" stroke-width="1" stroke-dasharray="4 8" /><text x="70" y="1087" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#C0C9DA" text-anchor="start" id="p25_text_0013">不含发饰；透视姿势另交结构说明。</text><rect x="528" y="174" width="1028" height="418" rx="14" fill="#202535" stroke="none" stroke-width="1" /><text x="554" y="216" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="25" fill="#F5F1E9" text-anchor="start" id="p25_text_0014">脸部构成 · 只作正面定位参考</text><ellipse cx="734" cy="397" rx="108" ry="140" fill="none" stroke="#97E2F6" stroke-width="3" /><line x1="734" y1="251" x2="734" y2="550" stroke="#8D9AB5" stroke-width="1" stroke-dasharray="5 5" /><line x1="612" y1="408.20000000000005" x2="862" y2="408.20000000000005" stroke="#D8BCF4" stroke-width="2" /><text x="888" y="414.20000000000005" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#D8BCF4" text-anchor="start" id="p25_text_0015">眼线 0.50–0.57 H</text><line x1="612" y1="458.6" x2="862" y2="458.6" stroke="#C0C9DA" stroke-width="2" /><text x="888" y="464.6" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#C0C9DA" text-anchor="start" id="p25_text_0016">鼻尖 0.68–0.75 H</text><line x1="612" y1="486.6" x2="862" y2="486.6" stroke="#E6BF7D" stroke-width="2" /><text x="888" y="492.6" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#E6BF7D" text-anchor="start" id="p25_text_0017">嘴线 0.78–0.85 H</text><text x="888" y="278" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="22" fill="#F5F1E9" text-anchor="start" id="p25_text_0018">先定头部朝向，再放五官。</text><text x="888" y="318" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#C0C9DA" text-anchor="start" id="p25_text_0019">眼神、颈根、头肩连接为硬项。</text><rect x="528" y="616" width="1028" height="502" rx="14" fill="#202535" stroke="none" stroke-width="1" /><text x="554" y="660" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="25" fill="#F5F1E9" text-anchor="start" id="p25_text_0020">既有 UI 窗口：分别裁切，不拉伸母版</text><rect x="554" y="702" width="156" height="184" rx="0" fill="none" stroke="#E6BF7D" stroke-width="2" /><rect x="570" y="718" width="124" height="152" rx="0" fill="none" stroke="#97E2F6" stroke-width="2" /><rect x="578" y="726" width="108" height="136" rx="0" fill="none" stroke="#D8BCF4" stroke-width="2" stroke-dasharray="4 4" /><text x="742" y="735" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#F5F1E9" text-anchor="start" id="p25_text_0021">P24 敌方窗 78 × 92（此处画成 2×）</text><text x="742" y="774" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#C0C9DA" text-anchor="start" id="p25_text_0022">透明孔 62 × 76；关键特征内缩 4 px。</text><text x="742" y="812" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#C0C9DA" text-anchor="start" id="p25_text_0023">全身、长角、武器不保证能同时展示。</text><rect x="554" y="928" width="288" height="118" rx="0" fill="none" stroke="#97E2F6" stroke-width="2" /><text x="868" y="960" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#F5F1E9" text-anchor="start" id="p25_text_0024">P23 编队：288 × 118</text><text x="868" y="998" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#F5F1E9" text-anchor="start" id="p25_text_0025">P23 档案：288 × 180</text><text x="868" y="1036" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#C0C9DA" text-anchor="start" id="p25_text_0026">优先脸部和主识别轮廓；专用横向裁切。</text><text x="44" y="1160" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#C0C9DA" text-anchor="start" id="p25_text_0027">3:4 半身审查图不是 236 × 174 手牌插画位；新窗口须经 P23 的 IC-21 受理。</text></svg>
