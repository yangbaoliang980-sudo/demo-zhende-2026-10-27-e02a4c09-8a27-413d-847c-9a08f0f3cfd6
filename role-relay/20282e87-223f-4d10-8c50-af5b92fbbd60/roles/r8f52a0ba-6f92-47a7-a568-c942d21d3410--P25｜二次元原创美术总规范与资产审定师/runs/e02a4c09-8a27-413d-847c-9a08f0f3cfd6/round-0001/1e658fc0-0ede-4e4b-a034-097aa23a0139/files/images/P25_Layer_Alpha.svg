<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" version="1.1"><title>P25 LAYER_AND_ALPHA_GUIDE</title><metadata>{"kind": "LAYER_AND_ALPHA_GUIDE", "production_allowed": false, "style_version": "P25-ART-BIBLE/0.1.0"}</metadata><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#121520" stroke="none" stroke-width="1" /><text x="44" y="40" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="17" fill="#E6BF7D" text-anchor="start" id="p25_text_0000">KOTODAMA BRIGADE / P25</text><text x="1556" y="40" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="17" fill="#C0C9DA" text-anchor="end" id="p25_text_0001">P25-ART-BIBLE / 0.1.0</text><text x="44" y="94" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="36" fill="#F5F1E9" text-anchor="start" id="p25_text_0002">可编辑源与透明导出 · 证明能修改</text><text x="44" y="132" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#C0C9DA" text-anchor="start" id="p25_text_0003">层名和文件扩展名只是线索；实际切层、局部修改与重导出才是证据</text><rect x="44" y="1038" width="1512" height="1" rx="0" fill="#8D9AB5" stroke="none" stroke-width="1" /><text x="44" y="1074" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="17" fill="#E6BF7D" text-anchor="start" id="p25_text_0004">规范图 · 不是人物/敌人成稿</text><text x="44" y="192" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="25" fill="#F5F1E9" text-anchor="start" id="p25_text_0005">建议层树</text><rect x="44" y="218" width="728" height="54" rx="6" fill="#202535" stroke="#8D9AB5" stroke-width="0.6" /><rect x="60" y="233" width="18" height="18" rx="0" fill="none" stroke="#E6BF7D" stroke-width="1" /><text x="94" y="252" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#D8BCF4" text-anchor="start" id="p25_text_0006">90_background</text><text x="314" y="252" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#F5F1E9" text-anchor="start" id="p25_text_0007">审查底色 · 透明导出时隐藏</text><rect x="44" y="282" width="728" height="54" rx="6" fill="#202535" stroke="#8D9AB5" stroke-width="0.6" /><rect x="60" y="297" width="18" height="18" rx="0" fill="none" stroke="#E6BF7D" stroke-width="1" /><text x="94" y="316" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#D8BCF4" text-anchor="start" id="p25_text_0008">80_light_fx</text><text x="314" y="316" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#F5F1E9" text-anchor="start" id="p25_text_0009">反光 / 特效 · 关闭后人物完整</text><rect x="44" y="346" width="728" height="54" rx="6" fill="#202535" stroke="#8D9AB5" stroke-width="0.6" /><rect x="60" y="361" width="18" height="18" rx="0" fill="none" stroke="#E6BF7D" stroke-width="1" /><text x="94" y="380" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#D8BCF4" text-anchor="start" id="p25_text_0010">70_hands_props</text><text x="314" y="380" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#F5F1E9" text-anchor="start" id="p25_text_0011">手与道具 · 连接和遮挡可检查</text><rect x="44" y="410" width="728" height="54" rx="6" fill="#202535" stroke="#8D9AB5" stroke-width="0.6" /><rect x="60" y="425" width="18" height="18" rx="0" fill="none" stroke="#E6BF7D" stroke-width="1" /><text x="94" y="444" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#D8BCF4" text-anchor="start" id="p25_text_0012">60_front_hair</text><text x="314" y="444" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#F5F1E9" text-anchor="start" id="p25_text_0013">前发 / 主色 / 阴影 / 高光</text><rect x="44" y="474" width="728" height="54" rx="6" fill="#202535" stroke="#8D9AB5" stroke-width="0.6" /><rect x="60" y="489" width="18" height="18" rx="0" fill="none" stroke="#E6BF7D" stroke-width="1" /><text x="94" y="508" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#D8BCF4" text-anchor="start" id="p25_text_0014">50_face</text><text x="314" y="508" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#F5F1E9" text-anchor="start" id="p25_text_0015">眉 / 眼 / 嘴 · 表情局部可编辑</text><rect x="44" y="538" width="728" height="54" rx="6" fill="#202535" stroke="#8D9AB5" stroke-width="0.6" /><rect x="60" y="553" width="18" height="18" rx="0" fill="none" stroke="#E6BF7D" stroke-width="1" /><text x="94" y="572" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#D8BCF4" text-anchor="start" id="p25_text_0016">40_outfit</text><text x="314" y="572" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#F5F1E9" text-anchor="start" id="p25_text_0017">服装底色与阴影</text><rect x="44" y="602" width="728" height="54" rx="6" fill="#202535" stroke="#8D9AB5" stroke-width="0.6" /><rect x="60" y="617" width="18" height="18" rx="0" fill="none" stroke="#E6BF7D" stroke-width="1" /><text x="94" y="636" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#D8BCF4" text-anchor="start" id="p25_text_0018">30_body_skin</text><text x="314" y="636" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#F5F1E9" text-anchor="start" id="p25_text_0019">身体与肤色</text><rect x="44" y="666" width="728" height="54" rx="6" fill="#202535" stroke="#8D9AB5" stroke-width="0.6" /><rect x="60" y="681" width="18" height="18" rx="0" fill="none" stroke="#E6BF7D" stroke-width="1" /><text x="94" y="700" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#D8BCF4" text-anchor="start" id="p25_text_0020">20_back_hair</text><text x="314" y="700" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#F5F1E9" text-anchor="start" id="p25_text_0021">后发</text><rect x="44" y="730" width="728" height="54" rx="6" fill="#202535" stroke="#8D9AB5" stroke-width="0.6" /><rect x="60" y="745" width="18" height="18" rx="0" fill="none" stroke="#E6BF7D" stroke-width="1" /><text x="94" y="764" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#D8BCF4" text-anchor="start" id="p25_text_0022">10_sketch</text><text x="314" y="764" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#F5F1E9" text-anchor="start" id="p25_text_0023">结构草稿 · 可隐藏</text><rect x="44" y="794" width="728" height="54" rx="6" fill="#202535" stroke="#8D9AB5" stroke-width="0.6" /><rect x="60" y="809" width="18" height="18" rx="0" fill="none" stroke="#E6BF7D" stroke-width="1" /><text x="94" y="828" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#D8BCF4" text-anchor="start" id="p25_text_0024">00_guides</text><text x="314" y="828" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="18" fill="#F5F1E9" text-anchor="start" id="p25_text_0025">安全线 · 不得烘焙进成品</text><text x="820" y="192" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="25" fill="#F5F1E9" text-anchor="start" id="p25_text_0026">导出审查：同一透明图，三种底色</text><rect x="820" y="220" width="214" height="205" rx="6" fill="#121520" stroke="#8D9AB5" stroke-width="1" /><ellipse cx="927" cy="312" rx="65" ry="65" fill="#71608E" stroke="#D8BCF4" stroke-width="3" /><path d="M 893 343 L 945 272 L 965 342" stroke="#E6BF7D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="820" y="459" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#F5F1E9" text-anchor="start" id="p25_text_0027">深底</text><rect x="1060" y="220" width="214" height="205" rx="6" fill="#F5F1E9" stroke="#8D9AB5" stroke-width="1" /><ellipse cx="1167" cy="312" rx="65" ry="65" fill="#71608E" stroke="#D8BCF4" stroke-width="3" /><path d="M 1133 343 L 1185 272 L 1205 342" stroke="#E6BF7D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1060" y="459" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#F5F1E9" text-anchor="start" id="p25_text_0028">浅底</text><rect x="1300" y="220" width="214" height="205" rx="6" fill="#ADB3BF" stroke="#8D9AB5" stroke-width="1" /><rect x="1300" y="220" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1360" y="220" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1420" y="220" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1480" y="220" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1330" y="248" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1390" y="248" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1450" y="248" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1300" y="276" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1360" y="276" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1420" y="276" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1480" y="276" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1330" y="304" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1390" y="304" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1450" y="304" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1300" y="332" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1360" y="332" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1420" y="332" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1480" y="332" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1330" y="360" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1390" y="360" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1450" y="360" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1300" y="388" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1360" y="388" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1420" y="388" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><rect x="1480" y="388" width="30" height="28" rx="0" fill="#DDE1E9" stroke="none" stroke-width="1" /><ellipse cx="1407" cy="312" rx="65" ry="65" fill="#71608E" stroke="#D8BCF4" stroke-width="3" /><path d="M 1373 343 L 1425 272 L 1445 342" stroke="#E6BF7D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1300" y="459" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#F5F1E9" text-anchor="start" id="p25_text_0029">棋盘</text><text x="820" y="514" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#C0C9DA" text-anchor="start" id="p25_text_0030">上方是几何测试形；不是角色素材。</text><text x="820" y="563" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="22" fill="#E6BF7D" text-anchor="start" id="p25_text_0031">RGBA8 / 无损 PNG</text><text x="820" y="595" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="19" fill="#C0C9DA" text-anchor="start" id="p25_text_0032">记录真实像素、alpha、色彩元数据</text><text x="820" y="648" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="22" fill="#E6BF7D" text-anchor="start" id="p25_text_0033">同画布 / 同原点 / 同锚点</text><text x="820" y="680" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="19" fill="#C0C9DA" text-anchor="start" id="p25_text_0034">不自动 trim，不在图集中随意旋转</text><text x="820" y="733" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="22" fill="#E6BF7D" text-anchor="start" id="p25_text_0035">源 → 导出哈希绑定</text><text x="820" y="765" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="19" fill="#C0C9DA" text-anchor="start" id="p25_text_0036">改源后重导出，并刷新每个 variant</text><text x="820" y="818" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="22" fill="#E6BF7D" text-anchor="start" id="p25_text_0037">可编辑性必须实际打开验证</text><text x="820" y="850" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="19" fill="#C0C9DA" text-anchor="start" id="p25_text_0038">空白 ORA 模板不能通过人物样本门禁</text><text x="820" y="903" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="22" fill="#E6BF7D" text-anchor="start" id="p25_text_0039">P25 / P37 / P30 / P35 分别签收</text><text x="820" y="935" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="19" fill="#C0C9DA" text-anchor="start" id="p25_text_0040">审美、权利、导入、流程不能互相代签</text><text x="44" y="929" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="23" fill="#F5F1E9" text-anchor="start" id="p25_text_0041">分层不是骨骼拆件：无需新增 Spine、3D 或逐帧动作成本。</text><text x="44" y="973" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#C0C9DA" text-anchor="start" id="p25_text_0042">P25 只提供规范模板与审查证据；画师的真实绘画仍由原岗位交付。</text></svg>
