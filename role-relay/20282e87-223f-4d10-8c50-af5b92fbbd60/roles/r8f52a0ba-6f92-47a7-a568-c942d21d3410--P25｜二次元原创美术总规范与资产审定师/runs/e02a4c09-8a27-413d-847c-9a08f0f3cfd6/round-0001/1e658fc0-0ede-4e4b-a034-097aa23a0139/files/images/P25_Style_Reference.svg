="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="260" y="780" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#F5F1E9" text-anchor="start" id="p25_text_0034">主光：左上</text><text x="260" y="816" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#C0C9DA" text-anchor="start" id="p25_text_0035">阴影有转折</text><text x="70" y="931" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#F5F1E9" text-anchor="start" id="p25_text_0036">软布：大面哑光</text><rect x="544" y="728" width="474" height="232" rx="12" fill="#202535" stroke="none" stroke-width="1" /><rect x="570" y="751" width="164" height="132" rx="10" fill="#F3EBE0" stroke="none" stroke-width="1" /><path d="M 652 751 L 734 751 L 734 883 L 690 883 Z" stroke="none" stroke-width="0" fill="#C5B1B0" stroke-linecap="round" stroke-linejoin="round" /><line x1="590" y1="774" x2="646" y2="774" stroke="#FFF9F1" stroke-width="3" /><text x="760" y="780" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#F5F1E9" text-anchor="start" id="p25_text_0037">同一结构</text><text x="760" y="816" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="20" fill="#C0C9DA" text-anchor="start" id="p25_text_0038">纹理后退</text><text x="570" y="931" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#F5F1E9" text-anchor="start" id="p25_text_0039">旧纸：平整弱纹理</text><rect x="1044" y="728" width="474" height="232" rx="12" fill="#202535" stroke="none" stroke-width="1" /><rect x="1070" y="751" width="164" height="132" rx="10" fill="#C6A56C" stroke="none" stroke-width="1" /><path d="M 1152 751 L 1234 751 L 1234 883 L 1190 883 Z" stroke="none" stroke-width="0" fill="#826544" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1102 766 L 1154 766" stroke="#F3DDB6" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1260" y="780" font-family="Noto Sans SC Thin,DejaVu Sans" font-size="21" fill="#F5F1E9" text-anchor="start" id="p25_text_004