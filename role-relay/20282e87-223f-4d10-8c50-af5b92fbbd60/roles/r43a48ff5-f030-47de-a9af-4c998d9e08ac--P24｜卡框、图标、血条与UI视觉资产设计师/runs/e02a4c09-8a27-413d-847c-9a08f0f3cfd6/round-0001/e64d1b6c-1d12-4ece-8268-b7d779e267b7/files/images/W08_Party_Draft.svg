<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="856" viewBox="0 0 1280 856" role="img" aria-labelledby="title desc" data-wireframe-id="W08_Party_Draft" data-screen-id="party">
<title id="title">编队 / 草稿与已保存</title><desc id="desc">P23 可编辑低保真线框。设计夹具，数字和名称不构成正式玩法参数。选择已占用角色时只交换草稿席位；保存成功须由新的已提交视图证明。</desc>
