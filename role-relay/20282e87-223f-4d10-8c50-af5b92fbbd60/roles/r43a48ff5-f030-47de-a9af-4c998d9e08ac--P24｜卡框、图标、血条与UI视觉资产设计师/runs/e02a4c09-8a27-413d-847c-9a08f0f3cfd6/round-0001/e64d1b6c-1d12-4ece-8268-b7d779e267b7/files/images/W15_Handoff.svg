<rect x="261" y="397" width="260" height="58" rx="9" fill="none" stroke="#005fcc" stroke-width="3" data-region="focus_indicator"/>
<rect x="540" y="402" width="200" height="48" rx="6" fill="#ffffff" stroke="#1b2635" stroke-width="1" data-anchor-id="ux.handoff.return" data-control="true"/>
<text x="604.0" y="414.75" font-size="18" fill="#1b2635" dominant-baseline="hanging" lang="zh-Hans">返回章节</text>
<rect x="248" y="498" width="1008" height="148" rx="6" fill="#f2f4f7" stroke="#626e7d" stroke-width="1"/>
<text x="266" y="518.0" font-size="22" fill="#1b2635" dominant-baseline="hanging" lang="zh-Hans">返回页面不会关闭这场战斗，也不会自动再创建一场。</text>
<text x="266" y="572.0" font-size="18" fill="#1b2635" dominant-baseline="hanging" lang="zh-Hans">正式接线后可进入已存在的 battle 引用，不能由 UI 生成胜负或奖励。</text>
</svg>
