<text x="608" y="369.0" font-size="16" fill="#445266" dominant-baseline="hanging" lang="zh-Hans">本条尚未授奖</text>
<rect x="932" y="272" width="324" height="134" rx="6" fill="#ffffff" stroke="#626e7d" stroke-width="1" data-anchor-id="ux.learning.wallet_proof"/>
<text x="950" y="288.0" font-size="22" fill="#1b2635" dominant-baseline="hanging" lang="zh-Hans">钱包</text>
