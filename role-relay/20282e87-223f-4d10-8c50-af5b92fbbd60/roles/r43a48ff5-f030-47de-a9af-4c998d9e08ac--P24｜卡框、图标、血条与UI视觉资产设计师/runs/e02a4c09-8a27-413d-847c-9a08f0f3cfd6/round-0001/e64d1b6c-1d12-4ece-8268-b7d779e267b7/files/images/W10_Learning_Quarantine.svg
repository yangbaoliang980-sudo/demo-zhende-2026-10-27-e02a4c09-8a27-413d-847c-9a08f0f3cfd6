<text x="950" y="369.0" font-size="16" fill="#445266" dominant-baseline="hanging" lang="zh-Hans">未计入隔离记录</text>
<rect x="248" y="430" width="1008" height="142" rx="6" fill="#ffffff" stroke="#626e7d" stroke-width="1"/>
<text x="266" y="446.0" font-size="22" fill="#1b2635" dominant-baseline="hanging" lang="zh-Hans">接下来可以做什么</text>
<text x="266" y="478.0" font-size="20" fill="#1b2635" dominant-baseline="hanging" lang="zh-Hans">重新查询此记录的处理状态；保持正常复习即可。</text>
<text x="266" y="519.0" font-size="18" fill="#1b2635" dominant-baseline="hanging" lang="zh-Hans">技术编号、原始原因码与证明来源放在可展开的记录详情中。</text>
<rect x="248" y="600" width="224" height="48" rx="6" fill="#1b2635" stroke="#1b2635" stroke-width="2" data-anchor-id="ux.learning.refresh" data-control="true"/>
