<rect x="243" y="595" width="234" height="58" rx="9" fill="none" stroke="#005fcc" stroke-width="3" data-region="focus_indicator"/>
<rect x="490" y="600" width="224" height="48" rx="6" fill="#ffffff" stroke="#1b2635" stroke-width="1" data-anchor-id="ux.learning.details" data-control="true"/>
<text x="548.0" y="612.75" font-size="18" fill="#1b2635" dominant-baseline="hanging" lang="zh-Hans">查看记录详情</text>
<text x="248" y="676.0" font-size="18" fill="#1b2635" dominant-baseline="hanging" lang="zh-Hans">状态更新后保留当前焦点，只读出有变化的一条摘要。</text>
