<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="856" viewBox="0 0 1280 856" role="img" aria-labelledby="title desc" data-wireframe-id="W12_Chapters" data-screen-id="chapters">
<title id="title">章节 / 挑战与首通资格</title><desc id="desc">P23 可编辑低保真线框。设计夹具，数字和名称不构成正式玩法参数。关卡状态按 P18 原视图显示；恢复冻结时入口禁用原因覆盖“可挑战”，但不改首通事实。</desc>
