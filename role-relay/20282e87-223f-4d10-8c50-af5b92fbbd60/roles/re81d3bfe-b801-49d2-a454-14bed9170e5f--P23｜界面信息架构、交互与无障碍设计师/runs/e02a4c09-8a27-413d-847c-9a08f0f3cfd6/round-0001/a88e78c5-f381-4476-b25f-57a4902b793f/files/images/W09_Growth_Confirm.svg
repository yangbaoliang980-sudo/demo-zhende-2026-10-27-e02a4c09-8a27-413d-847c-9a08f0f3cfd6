<rect x="393" y="591" width="230" height="58" rx="9" fill="none" stroke="#005fcc" stroke-width="3" data-region="focus_indicator"/>
<rect x="846" y="596" width="240" height="48" rx="6" fill="#1b2635" stroke="#1b2635" stroke-width="2" data-anchor-id="ux.growth.dialog_confirm" data-control="true"/>
<text x="903.0" y="608.75" font-size="18" fill="#ffffff" dominant-baseline="hanging" lang="zh-Hans">确认升级并提交</text>
<text x="248" y="708.0" font-size="18" fill="#1b2635" dominant-baseline="hanging" lang="zh-Hans">键盘：Tab 在框内切换；Esc 关闭并回到触发按钮。</text>
